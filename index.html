<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ShopVault — Product Store</title>
<link rel=""stylesheet href="./style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>

<header>
  <div class="logo">Shop<span>Vault</span></div>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 Cart <span id="cart-count">0</span>
  </button>
</header>

<div class="controls">
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Search products..." oninput="filterProducts()"/>
  </div>
  <select id="category-filter" onchange="filterProducts()">
    <option value="">All Categories</option>
  </select>
  <select id="sort-select" onchange="filterProducts()">
    <option value="">Sort by</option>
    <option value="low">Price: Low → High</option>
    <option value="high">Price: High → Low</option>
  </select>
</div>

<main>
  <div id="status">
    <span>Loading</span>
    <span class="loading-dot">.</span>
    <span class="loading-dot">.</span>
    <span class="loading-dot">.</span>
  </div>
  <div id="product-grid"></div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

<!-- Cart Drawer -->
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <h3>Your Cart</h3>
    <button class="close-btn" onclick="toggleCart()">✕</button>
  </div>
  <div id="cart-items-list"></div>
  <div class="cart-total" id="cart-total" style="display:none">
    Total: <strong id="cart-total-val">$0</strong>
  </div>
  <button class="checkout-btn" onclick="alert('Checkout coming soon! 🎉')">Proceed to Checkout</button>
</div>

<script src="./script.js"></script>
</body>
</html>
