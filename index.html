<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ShopVault — Product Store</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0f0e0d;
    --surface: #1a1917;
    --card: #211f1d;
    --border: #2e2c29;
    --accent: #e8b86d;
    --accent2: #c97c3a;
    --text: #f0ece4;
    --muted: #8a8072;
    --red: #e05c5c;
    --green: #5ce09a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    padding: 2rem 2.5rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    background: linear-gradient(135deg, #1a1917 0%, #0f0e0d 100%);
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px);
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--accent);
  }
  .logo span { color: var(--text); }
  .cart-btn {
    background: var(--accent);
    color: #0f0e0d;
    border: none;
    padding: 0.6rem 1.3rem;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex; align-items: center; gap: 0.4rem;
    transition: background 0.2s, transform 0.15s;
  }
  .cart-btn:hover { background: var(--accent2); transform: scale(1.04); }
  #cart-count {
    background: #0f0e0d;
    color: var(--accent);
    border-radius: 50%;
    width: 20px; height: 20px;
    font-size: 0.75rem;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700;
  }

  /* CONTROLS */
  .controls {
    padding: 1.5rem 2.5rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: center;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.65rem 1rem 0.65rem 2.5rem;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap::before {
    content: '🔍';
    position: absolute; left: 0.75rem; top: 50%;
    transform: translateY(-50%);
    font-size: 0.85rem;
    pointer-events: none;
  }
  select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.65rem 1rem;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  select:focus { border-color: var(--accent); }

  /* MAIN */
  main { padding: 2rem 2.5rem; }
  #status {
    text-align: center;
    padding: 4rem;
    font-size: 1.1rem;
    color: var(--muted);
    font-style: italic;
  }
  .loading-dot {
    display: inline-block;
    animation: blink 1.2s infinite;
  }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

  .error-msg { color: var(--red); font-size: 1rem; }

  /* GRID */
  #product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
  }

  /* CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
    animation: fadeUp 0.4s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    border-color: var(--accent);
  }
  .card-img {
    background: #fff;
    height: 200px;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    overflow: hidden;
  }
  .card-img img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
    transition: transform 0.3s;
  }
  .card:hover .card-img img { transform: scale(1.06); }

  .card-body {
    padding: 1.2rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .card-category {
    font-size: 0.7rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    background: rgba(232,184,109,0.1);
    padding: 2px 8px;
    border-radius: 100px;
    width: fit-content;
  }
  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.4;
    color: var(--text);
  }
  .card-desc {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.5;
    flex: 1;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.8rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--border);
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .price {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
    font-family: 'Playfair Display', serif;
  }
  .card-actions {
    display: flex;
    gap: 0.5rem;
  }
  .btn-view, .btn-cart {
    border: none;
    border-radius: 8px;
    padding: 0.45rem 0.85rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-view {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-view:hover { border-color: var(--accent); color: var(--accent); }
  .btn-cart {
    background: var(--accent);
    color: #0f0e0d;
  }
  .btn-cart:hover { background: var(--accent2); transform: scale(1.05); }
  .btn-cart.added {
    background: var(--green);
    color: #0f0e0d;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 999;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.active { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    max-width: 560px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    transform: scale(0.92);
    transition: transform 0.25s;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }
  .modal-overlay.active .modal { transform: scale(1); }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .modal-img { background: #fff; border-radius: 12px; padding: 1.5rem; text-align: center; }
  .modal-img img { max-height: 220px; max-width: 100%; object-fit: contain; }
  .modal h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; line-height: 1.4; }
  .modal-desc { color: var(--muted); font-size: 0.9rem; line-height: 1.7; }
  .modal-meta { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  .modal-price { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--accent); font-weight: 900; }
  .modal-rating { font-size: 0.85rem; color: var(--muted); }
  .close-btn {
    background: var(--border);
    border: none;
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .close-btn:hover { background: var(--red); }

  /* CART DRAWER */
  .cart-drawer {
    position: fixed; top: 0; right: -100%;
    width: min(420px, 100vw);
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 1000;
    padding: 1.5rem;
    display: flex; flex-direction: column; gap: 1rem;
    transition: right 0.3s cubic-bezier(0.4,0,0.2,1);
    overflow-y: auto;
  }
  .cart-drawer.open { right: 0; }
  .cart-header { display: flex; justify-content: space-between; align-items: center; }
  .cart-header h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; }
  .cart-item {
    display: flex; gap: 1rem; align-items: center;
    background: var(--card);
    border-radius: 12px;
    padding: 0.75rem;
    border: 1px solid var(--border);
  }
  .cart-item img { width: 50px; height: 50px; object-fit: contain; background: #fff; border-radius: 8px; padding: 4px; }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-title { font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cart-item-price { font-size: 0.85rem; color: var(--accent); font-weight: 700; }
  .remove-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1.1rem; padding: 4px; }
  .cart-total { border-top: 1px solid var(--border); padding-top: 1rem; font-size: 1rem; }
  .cart-total strong { color: var(--accent); font-size: 1.4rem; }
  .checkout-btn {
    background: var(--accent); color: #0f0e0d;
    border: none; border-radius: 12px;
    padding: 0.9rem; font-family: 'DM Sans', sans-serif;
    font-weight: 600; font-size: 1rem;
    cursor: pointer; transition: background 0.2s;
    margin-top: auto;
  }
  .checkout-btn:hover { background: var(--accent2); }
  .empty-cart { color: var(--muted); text-align: center; font-style: italic; padding: 2rem; }

  .no-results { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 3rem; font-style: italic; }
</style>
</head>
<body>

<header>
  <div class="logo">Shop<span>Vault</span></div>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 Cart <span id="cart-count">0</span>
  </button>
</header>

<div class="controls">
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Search products..." oninput="filterProducts()"/>
  </div>
  <select id="category-filter" onchange="filterProducts()">
    <option value="">All Categories</option>
  </select>
  <select id="sort-select" onchange="filterProducts()">
    <option value="">Sort by</option>
    <option value="low">Price: Low → High</option>
    <option value="high">Price: High → Low</option>
  </select>
</div>

<main>
  <div id="status">
    <span>Loading</span>
    <span class="loading-dot">.</span>
    <span class="loading-dot">.</span>
    <span class="loading-dot">.</span>
  </div>
  <div id="product-grid"></div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

<!-- Cart Drawer -->
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <h3>Your Cart</h3>
    <button class="close-btn" onclick="toggleCart()">✕</button>
  </div>
  <div id="cart-items-list"></div>
  <div class="cart-total" id="cart-total" style="display:none">
    Total: <strong id="cart-total-val">$0</strong>
  </div>
  <button class="checkout-btn" onclick="alert('Checkout coming soon! 🎉')">Proceed to Checkout</button>
</div>

<script>
  let allProducts = [];
  let cart = JSON.parse(localStorage.getItem('shopvault_cart') || '[]');

  // ─── FETCH ───────────────────────────────────────────
  fetch('https://fakestoreapi.com/products/')
    .then(res => {
      if (!res.ok) throw new Error('Network response was not ok');
      return res.json();
    })
    .then(data => {
      allProducts = data;
      document.getElementById('status').style.display = 'none';
      populateCategories(data);
      displayProducts(data);
    })
    .catch(err => {
      document.getElementById('status').innerHTML =
        '<span class="error-msg">⚠️ Failed to load data. Please try again later.</span>';
    });

  // ─── POPULATE CATEGORIES ─────────────────────────────
  function populateCategories(data) {
    const cats = [...new Set(data.map(p => p.category))];
    const sel = document.getElementById('category-filter');
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c.charAt(0).toUpperCase() + c.slice(1);
      sel.appendChild(opt);
    });
  }

  // ─── DISPLAY PRODUCTS ────────────────────────────────
  function displayProducts(data) {
    const grid = document.getElementById('product-grid');
    grid.innerHTML = '';
    if (!data.length) {
      grid.innerHTML = '<div class="no-results">No products found matching your search.</div>';
      return;
    }
    data.forEach((p, i) => {
      const title = p.title.length > 50 ? p.title.slice(0, 47) + '…' : p.title;
      const desc = p.description.length > 60 ? p.description.slice(0, 57) + '…' : p.description;
      const inCart = cart.some(c => c.id === p.id);
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (i * 0.05) + 's';
      card.innerHTML = `
        <div class="card-img">
          <img src="${p.image}" alt="${title}" loading="lazy"/>
        </div>
        <div class="card-body">
          <span class="card-category">${p.category}</span>
          <div class="card-title">${title}</div>
          <div class="card-desc">${desc}</div>
          <div class="card-footer">
            <div class="price">$${p.price.toFixed(2)}</div>
            <div class="card-actions">
              <button class="btn-view" onclick='openModal(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Details</button>
              <button class="btn-cart ${inCart ? 'added' : ''}" id="cart-btn-${p.id}"
                onclick='addToCart(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
                ${inCart ? '✓ Added' : '+ Cart'}
              </button>
            </div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // ─── FILTER / SORT ───────────────────────────────────
  function filterProducts() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const category = document.getElementById('category-filter').value;
    const sort = document.getElementById('sort-select').value;

    let filtered = allProducts.filter(p => {
      const matchSearch = p.title.toLowerCase().includes(query);
      const matchCat = !category || p.category === category;
      return matchSearch && matchCat;
    });

    if (sort === 'low') filtered.sort((a, b) => a.price - b.price);
    if (sort === 'high') filtered.sort((a, b) => b.price - a.price);

    displayProducts(filtered);
  }

  // ─── MODAL ───────────────────────────────────────────
  function openModal(p) {
    const stars = '★'.repeat(Math.round(p.rating?.rate || 0)) + '☆'.repeat(5 - Math.round(p.rating?.rate || 0));
    document.getElementById('modal-content').innerHTML = `
      <div class="modal-header">
        <span class="card-category">${p.category}</span>
        <button class="close-btn" onclick="closeModalDirect()">✕</button>
      </div>
      <div class="modal-img">
        <img src="${p.image}" alt="${p.title}"/>
      </div>
      <h2>${p.title}</h2>
      <div class="modal-meta">
        <div class="modal-price">$${p.price.toFixed(2)}</div>
        <div class="modal-rating">${stars} (${p.rating?.count || 0} reviews)</div>
      </div>
      <div class="modal-desc">${p.description}</div>
      <button class="btn-cart" style="padding:0.7rem 1.5rem;border-radius:10px;font-size:0.95rem"
        onclick='addToCart(${JSON.stringify(p).replace(/'/g,"&#39;")});'>
        🛒 Add to Cart
      </button>
    `;
    document.getElementById('modal-overlay').classList.add('active');
  }
  function closeModal(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModalDirect();
  }
  function closeModalDirect() {
    document.getElementById('modal-overlay').classList.remove('active');
  }

  // ─── CART ────────────────────────────────────────────
  function addToCart(p) {
    if (!cart.some(c => c.id === p.id)) {
      cart.push(p);
      localStorage.setItem('shopvault_cart', JSON.stringify(cart));
    }
    updateCartUI();
    const btn = document.getElementById('cart-btn-' + p.id);
    if (btn) { btn.textContent = '✓ Added'; btn.classList.add('added'); }
  }

  function removeFromCart(id) {
    cart = cart.filter(c => c.id !== id);
    localStorage.setItem('shopvault_cart', JSON.stringify(cart));
    updateCartUI();
    renderCartDrawer();
    // refresh cards
    filterProducts();
  }

  function updateCartUI() {
    document.getElementById('cart-count').textContent = cart.length;
    renderCartDrawer();
  }

  function renderCartDrawer() {
    const list = document.getElementById('cart-items-list');
    const totalEl = document.getElementById('cart-total');
    const totalVal = document.getElementById('cart-total-val');
    if (!cart.length) {
      list.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
      totalEl.style.display = 'none';
      return;
    }
    totalEl.style.display = 'block';
    const total = cart.reduce((s, p) => s + p.price, 0);
    totalVal.textContent = '$' + total.toFixed(2);
    list.innerHTML = cart.map(p => `
      <div class="cart-item">
        <img src="${p.image}" alt="${p.title}"/>
        <div class="cart-item-info">
          <div class="cart-item-title">${p.title.slice(0,40)}…</div>
          <div class="cart-item-price">$${p.price.toFixed(2)}</div>
        </div>
        <button class="remove-btn" onclick="removeFromCart(${p.id})">✕</button>
      </div>
    `).join('');
  }

  function toggleCart() {
    document.getElementById('cart-drawer').classList.toggle('open');
    renderCartDrawer();
  }

  // init cart count
  updateCartUI();
</script>
</body>
</html>
